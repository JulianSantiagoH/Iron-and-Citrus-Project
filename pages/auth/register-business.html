<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de empresa | Iron &amp; Citrus</title>
</head>
<body>
  <header>
    <a href="../../index.html">Iron &amp; Citrus</a>
    <nav>
      <ul>
        <li><a href="../../index.html">Inicio</a></li>
        <li><a href="../foods/index.html">Alimentos</a></li>
        <li><a href="../plans/index.html">Planes</a></li>
        <li><a href="../community/forum.html">Comunidad</a></li>
        <li><a href="../profile.html">Mi perfil</a></li>
        <li><a href="login.html">Iniciar sesión</a></li>
        <li><a href="register.html">Registrarse</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h1>Registro de empresa</h1>
      <form>
        <div>
          <label for="company-name">Nombre de la empresa</label>
          <input type="text" id="company-name" name="company-name">
        </div>
        <div>
          <label for="company-type">Tipo de empresa</label>
          <select id="company-type" name="company-type">
            <option value="food">Productora de alimentos</option>
            <option value="supplement">Suplementos deportivos</option>
            <option value="gym">Gimnasio o centro fitness</option>
            <option value="nutrition">Servicios de nutrición</option>
            <option value="other">Otro</option>
          </select>
        </div>
        <div>
          <label for="contact-name">Nombre de contacto</label>
          <input type="text" id="contact-name" name="contact-name">
        </div>
        <div>
          <label for="email">Correo electrónico corporativo</label>
          <input type="email" id="email" name="email">
        </div>
        <div>
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password">
        </div>
        <div>
          <label for="description">Descripción de la empresa</label>
          <textarea id="description" name="description"></textarea>
        </div>
        <button type="submit">Registrar empresa</button>
      </form>
      <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>.</p>
      <p>¿Eres una persona física? <a href="register.html">Registro de usuario</a>.</p>
    </section>
  </main>

  <footer>
    <p>© 2026 Iron &amp; Citrus — Fitness, Nutrición y Bienestar.</p>
  </footer>
</body>
</html>
